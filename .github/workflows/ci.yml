name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://braupartner:change-me@localhost:5432/braupartner
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: braupartner
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: braupartner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U braupartner -d braupartner"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Migrate database
        run: python -m alembic -c backend/alembic.ini upgrade head
      - name: Run tests
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, lint and build
        run: |
          npm ci
          npm run lint
          npm run build
